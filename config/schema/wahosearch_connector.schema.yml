wahosearch_connector.settings:
  type: config_object
  label: 'WahoSearch Connector settings'
  mapping:
    endpoint:
      type: string
      label: 'SaaS API base URL'
    site_id:
      type: string
      label: 'Site ID'
    timeout:
      type: integer
      label: 'Request timeout in seconds'
    batch_size:
      type: integer
      label: 'Items per request'
    sync_on_save:
      type: boolean
      label: 'Queue changes automatically when content is saved'
    immediate:
      type: boolean
      label: 'Send queued changes at the end of the request instead of waiting for cron'
    log_retention_days:
      type: integer
      label: 'Days to keep log entries'
    reconcile_days:
      type: integer
      label: 'Days between automatic reconciliation runs, 0 to turn off'
    pdf_max_mb:
      type: integer
      label: 'Largest PDF to send, in megabytes'
    include_paths:
      type: string
      label: 'Only index these URL paths'
    exclude_paths:
      type: string
      label: 'Never index these URL paths'
    priority_sections:
      type: string
      label: 'Priority sections, most important first'
    search_page:
      type: boolean
      label: 'Provide the search page'
    search_mode:
      type: string
      label: 'How results are shown: drupal or hosted'
    chatbot:
      type: boolean
      label: 'Show the chatbot on public pages'
    bundles:
      type: sequence
      label: 'Indexed content types'
      sequence:
        type: mapping
        label: 'Content type'
        mapping:
          enabled:
            type: boolean
            label: 'Indexed'
          include_private:
            type: boolean
            label: 'Include content not visible to anonymous visitors'
          include_pdfs:
            type: boolean
            label: 'Index PDF files attached to this content'
          fields:
            type: sequence
            label: 'Mapped fields'
            sequence:
              type: mapping
              label: 'Field mapping'
              mapping:
                target:
                  type: string
                  label: 'Target name in the SaaS index'
                role:
                  type: string
                  label: 'Field role'
                pdf_fallback:
                  type: boolean
                  label: 'Send only when no PDF of the item is indexed'
